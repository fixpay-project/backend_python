services:
  - type: web
    name: fixpay-backend
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn ssepl_backend.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fixpay-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: ALLOWED_HOSTS
        value: "*"

databases:
  - name: fixpay-postgres
    databaseName: ssepl_admin_db
    user: ssepl_user
